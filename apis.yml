name: Nova Credit
description: >-
  Nova Credit is a fintech consumer-credit-data platform that gives lenders and
  financial institutions a single API to access unified consumer credit data
  from more than 26 sources — international credit bureaus, bank-transaction
  aggregators, payroll systems, and automated document data. Its products
  (Credit Passport, Cash Atlas, Income Navigator, and Eligibility Compass) let
  institutions underwrite qualified newcomers and thin-file applicants with
  translated international credit history, run cashflow-based underwriting from
  bank data, automate income verification with fraud detection, and speed
  income/asset verification for affordable housing. The developer platform
  exposes REST APIs over api.novacredit.com with a dedicated sandbox host,
  HTTP Basic to short-lived Bearer authentication, JWE-encrypted report
  payloads, hosted NovaConnect consent webviews, webhooks, SCIM and SSO.
